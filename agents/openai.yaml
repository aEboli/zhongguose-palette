interface:
  display_name: "中国色配色"
  short_description: "用 526 中国传统色生成配色，说人话就行"
  default_prompt: "用 $zhongguose-palette 从 zhongguose.com 的 526 个中国传统色里选配色。把用户的原话原样交给 scripts/palette.py ask \"<原话>\"，不要自己先翻成场景名或旗标。用户提到配色、色板、中国色、传统色、国风，或点名故宫、青花、水墨、敦煌、宋瓷、唐三彩、江南、漆器、年画、祭天、王府、补服时使用；提到梅兰竹菊、荷花、远山、水纹、回纹、冰裂、祥云、锦地开光这类纹样点缀时也用它（ask 会自己认出来，纹样借已有颜色画，不引入新色）；用户做前端、artifact、图表而需要中国风颜色时也用它先定色。对用户不要说主场/结构/点缀/五行/彩度/氛围/场景/borrows_token 这些内部词，只说色名、hex、铺在哪、多大面积、字用什么、纹样借哪个颜色画。禁止发明 hex，禁止输出泛称「中国红」。五爪龙、十二章、补子等第这类有礼制含义的纹样不作普通标记，拒绝时要给替代路径。"
  brand_color: "#1772b4"
