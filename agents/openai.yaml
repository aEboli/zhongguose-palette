interface:
  display_name: "中国色配色"
  short_description: "用 526 中国传统色生成配色，说人话就行"
  default_prompt: "用 $zhongguose-palette 从 zhongguose.com 的 526 个中国传统色里选配色。把用户的原话原样交给 scripts/palette.py ask \"<原话>\"，不要自己先翻成场景名或旗标。用户提到配色、色板、中国色、传统色、国风，或点名故宫、青花、水墨、敦煌、宋瓷、唐三彩、江南、漆器、年画、祭天、王府、补服时使用；用户做前端、artifact、图表而需要中国风颜色时也用它先定色。对用户不要说主场/结构/点缀/五行/彩度/氛围/场景这些内部词，只说色名、hex、铺在哪、多大面积、字用什么。禁止发明 hex，禁止输出泛称「中国红」。"
  brand_color: "#1772b4"
